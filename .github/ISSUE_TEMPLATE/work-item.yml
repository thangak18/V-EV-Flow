name: Coding work item
description: Shared Codex / Claude Code issue with scope and reproducible acceptance
title: "[Work] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and audience
      description: Describe the user-visible outcome and who benefits.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Current and expected behavior
      description: Include a concrete example and exclusions. Link relevant SPEC and plan sections.
    validations:
      required: true
  - type: textarea
    id: task-spec
    attributes:
      label: Harness task specification
      description: Replace placeholders. Assign exactly one GitHub user separately. Dependency readiness is read from GitHub, never from a local flag.
      render: json
      value: |
        {
          "lane": "web-map",
          "reviewer": "replace-with-non-author-login",
          "scope": ["app/frontend/src/**"],
          "acceptance": [
            {"id": "AC-01", "description": "Replace with observable behavior", "verification": ["test"]}
          ],
          "dependencies": [],
          "contract_impact": "none",
          "data_origin": "small mock/synthetic fixtures; no partner data",
          "rollback": "revert the issue commit"
        }
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: Environment, dependency and start conditions
      description: Link dependency issues/PRs and tooling prerequisites. Identify manual checks, screenshots, limitations and required permissions.
    validations:
      required: true

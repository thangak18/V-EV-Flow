name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: "false"

jobs:
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff format --check app .github/scripts
      - run: uv run ruff check app .github/scripts
      - run: uv run pyright app/backend .github/scripts
      - run: uv run lint-imports

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest app/backend --cov=app.backend --cov-report=term-missing --cov-fail-under=75

  contract-check:
    name: contract-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: npm --prefix app/frontend ci
      - run: uv run python -m app.backend.api.generate_openapi --check
      - run: npm --prefix app/frontend run lint:openapi
      - run: npm --prefix app/frontend run generate:api
      - run: git diff --exit-code -- app/backend/contracts/openapi.yaml app/frontend/src/types/api.generated.ts
      - name: Materialize main's OpenAPI baseline
        id: openapi-baseline
        run: bash .github/scripts/prepare-openapi-baseline.sh origin/main .openapi-main.yaml
      - name: Check OpenAPI compatibility against main
        if: steps.openapi-baseline.outputs.present == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.0.18
        with:
          base: .openapi-main.yaml
          revision: app/backend/contracts/openapi.yaml
          fail-on-diff: "true"

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix app/frontend ci
      - run: npm --prefix app/frontend run lint
      - run: npm --prefix app/frontend run format:check
      - run: npm --prefix app/frontend run test:coverage
      - run: npm --prefix app/frontend run build

  integration-smoke:
    name: integration-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix app/frontend ci
      - run: npm --prefix app/frontend exec playwright install --with-deps chromium
      - run: make smoke
        env:
          DATA_BACKEND: mock
          PREDICTOR_BACKEND: fake
          ROUTE_BACKEND: fake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ github.sha }}
          path: app/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: uv sync --frozen
      - run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
      - run: uv run pip-audit
      - run: npm --prefix app/frontend ci
      - run: npm --prefix app/frontend audit --audit-level=high

  harness-check:
    name: harness-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: make harness-check
      - name: Check PR scope using the trusted base validator
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          mkdir -p .harness/ci
          validator=.github/scripts/harness.py
          if [[ -n "$BASE_SHA" ]]; then
            if git cat-file -e "$BASE_SHA:.github/scripts/harness.py" 2>/dev/null; then
              git show "$BASE_SHA:.github/scripts/harness.py" > "$RUNNER_TEMP/vev-harness.py"
              validator="$RUNNER_TEMP/vev-harness.py"
            elif [[ "$HEAD_BRANCH" != "codex/harness-bootstrap" ]]; then
              echo 'BLOCKED: base has no trusted harness validator; bootstrap must land first.'
              exit 2
            fi
          fi
          scope_exit=0
          python3 "$validator" ci --event-file "$GITHUB_EVENT_PATH" > .harness/ci/scope.json || scope_exit=$?
          cat .harness/ci/scope.json
          export HARNESS_SCOPE_EXIT="$scope_exit"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          value = json.loads(Path(".harness/ci/scope.json").read_text())
          if not isinstance(value, dict):
              raise SystemExit("Unexpected harness scope result: expected an object")
          status = int(os.environ["HARNESS_SCOPE_EXIT"])
          head, base = os.environ["CHECKED_HEAD"], os.environ["BASE_SHA"]
          bootstrap = (
              status == 2
              and bool(base)
              and os.environ["HEAD_BRANCH"] == "codex/harness-bootstrap"
              and value.get("result") == "BLOCKED"
              and value.get("checks") == "PASS"
              and value.get("mode") == "bootstrap"
              and value.get("scope") == "BLOCKED"
              and value.get("foundation_review") == "BLOCKED"
              and value.get("manual_acceptance") == "BLOCKED"
              and value.get("review_ready") is False
              and value.get("head") == head
              and value.get("base") == base
          )
          if bootstrap:
              print(
                  "::warning title=Bootstrap manual acceptance required::"
                  f"Technical checks passed for head {head} / base {base}; "
                  "scope/policy and Foundation acceptance remain BLOCKED. "
                  "A green job does not establish review-ready or permission to merge."
              )
              summary = (
                  "## Bootstrap: technical checks PASS; manual acceptance BLOCKED\n\n"
                  f"- PR head: `{head}`\n- Integration base: `{base}`\n"
                  "- Automated scope: **BLOCKED** (no trusted base validator).\n"
                  "- Foundation snapshot acceptance: **BLOCKED** (separate human gate).\n"
                  "- Manual scope/policy acceptance: **BLOCKED**; `review_ready=false`.\n\n"
                  "Required human records linked on the PR before bootstrap landing:\n\n"
                  "- [ ] Non-author human PR approval for this exact head/base.\n"
                  "- [ ] Manual scope/policy acceptance covering the bootstrap diff, "
                  "protected paths, initial policy and validator; record exact head/base and reviewer.\n"
                  "- [ ] Fresh clean-revision local full CI, hosted required checks, "
                  "AC evidence, resolved conversations, limitations and rollback checked.\n"
                  "- [ ] Integrator rechecks current head/base; new commits invalidate "
                  "old approval/acceptance. Manual merge remains a human decision.\n\n"
                  "Separate gate before opening feature lanes:\n\n"
                  "- [ ] Independent Foundation snapshot acceptance record. "
                  "Foundation may remain BLOCKED for tooling landing; "
                  "bootstrap approval does not substitute for Foundation acceptance.\n\n"
                  "The repository is currently unprotected; CI cannot enforce human merge decisions.\n"
              )
          elif (
              status == 0
              and value.get("result") == "PASS"
              and value.get("mode") != "bootstrap"
              and all(
                  gate not in value or value[gate] in ("PASS", "NOT RUN")
                  for gate in ("scope", "foundation_review", "manual_acceptance")
              )
              and (not base or (value.get("head") == head and value.get("base") == base))
          ):
              summary = (
                  "## Harness technical check\n\n"
                  f"- Head: `{head}`\n- Integration base: `{base or 'Not a PR event'}`\n"
                  "- Technical validator result: **PASS**.\n"
                  "- Human approval/merge acceptance: **not established by CI**.\n"
              )
              if not base:
                  summary += "- Push self-check does not validate PR task scope.\n"
          else:
              print("::error::Unexpected or failed harness scope result; manual gates cannot be inferred.")
              raise SystemExit(status if status in (1, 2) else 1)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(summary)
          PY
      - name: Record independent execution identity
        if: always()
        env:
          CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p .harness/ci
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          value = {
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "expected_head": os.environ["CHECKED_HEAD"],
              "result": os.environ["JOB_RESULT"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "provenance": "GitHub Actions harness-check job; not local self-reported evidence",
          }
          Path(".harness/ci/execution.json").write_text(json.dumps(value, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-${{ github.event.pull_request.head.sha || github.sha }}
          path: .harness/ci/
          retention-days: 14

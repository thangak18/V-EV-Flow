name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: "false"

jobs:
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff format --check app
      - run: uv run ruff check app
      - run: uv run pyright app/backend
      - run: uv run lint-imports

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest app/backend --cov=app.backend --cov-report=term-missing --cov-fail-under=75

  contract-check:
    name: contract-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: npm --prefix app/frontend ci
      - run: uv run python -m app.backend.api.generate_openapi --check
      - run: npm --prefix app/frontend run lint:openapi
      - run: npm --prefix app/frontend run generate:api
      - run: git diff --exit-code -- app/backend/contracts/openapi.yaml app/frontend/src/types/api.generated.ts
      - name: Materialize main's OpenAPI baseline
        id: openapi-baseline
        run: bash .github/scripts/prepare-openapi-baseline.sh origin/main .openapi-main.yaml
      - name: Check OpenAPI compatibility against main
        if: steps.openapi-baseline.outputs.present == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.0.18
        with:
          base: .openapi-main.yaml
          revision: app/backend/contracts/openapi.yaml
          fail-on-diff: "true"

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix app/frontend ci
      - run: npm --prefix app/frontend run lint
      - run: npm --prefix app/frontend run format:check
      - run: npm --prefix app/frontend run test:coverage
      - run: npm --prefix app/frontend run build

  integration-smoke:
    name: integration-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix app/frontend ci
      - run: npm --prefix app/frontend exec playwright install --with-deps chromium
      - run: npm --prefix app/frontend run test:e2e
        env:
          DATA_BACKEND: mock
          PREDICTOR_BACKEND: fake
          ROUTE_BACKEND: fake

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: uv sync --frozen
      - run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
      - run: uv run pip-audit
      - run: npm --prefix app/frontend ci
      - run: npm --prefix app/frontend audit --audit-level=high

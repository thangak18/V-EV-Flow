components:
  schemas:
    AddPortsChange:
      additionalProperties: false
      properties:
        kind:
          const: add_ports
          title: Kind
          type: string
        ports:
          default: 2
          maximum: 20.0
          minimum: 1.0
          title: Ports
          type: integer
        station_id:
          minLength: 1
          title: Station Id
          type: string
      required:
      - kind
      - station_id
      title: AddPortsChange
      type: object
    Coordinate:
      additionalProperties: false
      properties:
        lat:
          maximum: 90.0
          minimum: -90.0
          title: Lat
          type: number
        lng:
          maximum: 180.0
          minimum: -180.0
          title: Lng
          type: number
      required:
      - lat
      - lng
      title: Coordinate
      type: object
    DataType:
      enum:
      - mock
      - simulated
      - real
      - mixed
      title: DataType
      type: string
    ErrorResponse:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorResponse
      type: object
    FeatureContribution:
      additionalProperties: false
      properties:
        contribution:
          title: Contribution
          type: number
        feature:
          minLength: 1
          title: Feature
          type: string
        value:
          title: Value
          type: number
      required:
      - feature
      - value
      - contribution
      title: FeatureContribution
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IngestResult:
      additionalProperties: false
      properties:
        accepted:
          title: Accepted
          type: integer
        data_type:
          const: real
          default: real
          title: Data Type
          type: string
        source:
          title: Source
          type: string
      required:
      - accepted
      - source
      title: IngestResult
      type: object
    ModelExplanation:
      additionalProperties: false
      properties:
        bias:
          title: Bias
          type: number
        calibrated_probability:
          maximum: 1.0
          minimum: 0.0
          title: Calibrated Probability
          type: number
        features:
          items:
            $ref: '#/components/schemas/FeatureContribution'
          minItems: 1
          title: Features
          type: array
        method:
          const: tree_shap
          default: tree_shap
          title: Method
          type: string
        raw_probability:
          maximum: 1.0
          minimum: 0.0
          title: Raw Probability
          type: number
        raw_score:
          title: Raw Score
          type: number
        space:
          const: raw_margin_log_odds
          default: raw_margin_log_odds
          title: Space
          type: string
      required:
      - bias
      - raw_score
      - raw_probability
      - calibrated_probability
      - features
      title: ModelExplanation
      type: object
    PartnerSnapshot:
      additionalProperties: false
      properties:
        n_ports:
          minimum: 1.0
          title: N Ports
          type: integer
        ports_broken:
          minimum: 0.0
          title: Ports Broken
          type: integer
        ports_busy:
          minimum: 0.0
          title: Ports Busy
          type: integer
        ports_free:
          minimum: 0.0
          title: Ports Free
          type: integer
        scenario:
          $ref: '#/components/schemas/Scenario'
        station_id:
          minLength: 1
          title: Station Id
          type: string
        ts:
          format: date-time
          title: Ts
          type: string
      required:
      - station_id
      - ts
      - ports_free
      - ports_busy
      - ports_broken
      - n_ports
      - scenario
      title: PartnerSnapshot
      type: object
    PlaceLocation:
      additionalProperties: false
      properties:
        label:
          maxLength: 1024
          minLength: 1
          title: Label
          type: string
        lat:
          maximum: 90.0
          minimum: -90.0
          title: Lat
          type: number
        lng:
          maximum: 180.0
          minimum: -180.0
          title: Lng
          type: number
        place_id:
          maxLength: 1024
          minLength: 1
          title: Place Id
          type: string
        provider:
          default: goong
          title: Provider
          type: string
      required:
      - lat
      - lng
      - place_id
      - label
      title: PlaceLocation
      type: object
    PlaceSuggestion:
      additionalProperties: false
      properties:
        description:
          maxLength: 1024
          minLength: 1
          title: Description
          type: string
        place_id:
          maxLength: 1024
          minLength: 1
          title: Place Id
          type: string
      required:
      - place_id
      - description
      title: PlaceSuggestion
      type: object
    PlaceSuggestions:
      additionalProperties: false
      properties:
        predictions:
          items:
            $ref: '#/components/schemas/PlaceSuggestion'
          title: Predictions
          type: array
        provider:
          default: goong
          title: Provider
          type: string
      required:
      - predictions
      title: PlaceSuggestions
      type: object
    Plan:
      additionalProperties: false
      properties:
        arrival_soc_pct:
          maximum: 100.0
          minimum: 0.0
          title: Arrival Soc Pct
          type: number
        detour_km:
          minimum: 0.0
          title: Detour Km
          type: number
        distance_km:
          minimum: 0.0
          title: Distance Km
          type: number
        eta:
          format: date-time
          title: Eta
          type: string
        explanation:
          anyOf:
          - $ref: '#/components/schemas/ModelExplanation'
          - type: 'null'
        p_available:
          maximum: 1.0
          minimum: 0.0
          title: P Available
          type: number
        station_id:
          minLength: 1
          title: Station Id
          type: string
      required:
      - station_id
      - eta
      - distance_km
      - detour_km
      - arrival_soc_pct
      - p_available
      title: Plan
      type: object
    PredictRequest:
      additionalProperties: false
      properties:
        connector_type:
          minLength: 1
          title: Connector Type
          type: string
        eta:
          format: date-time
          title: Eta
          type: string
        observed_at:
          format: date-time
          title: Observed At
          type: string
        scenario:
          $ref: '#/components/schemas/Scenario'
        station_id:
          minLength: 1
          title: Station Id
          type: string
      required:
      - station_id
      - observed_at
      - eta
      - connector_type
      - scenario
      title: PredictRequest
      type: object
    PredictionResult:
      additionalProperties: false
      properties:
        contract_version:
          default: 0.1.0
          title: Contract Version
          type: string
        data_type:
          $ref: '#/components/schemas/DataType'
        eta:
          format: date-time
          title: Eta
          type: string
        explanation:
          anyOf:
          - $ref: '#/components/schemas/ModelExplanation'
          - type: 'null'
        explanation_method:
          minLength: 1
          title: Explanation Method
          type: string
        model_version:
          minLength: 1
          title: Model Version
          type: string
        p_available:
          maximum: 1.0
          minimum: 0.0
          title: P Available
          type: number
        reasons:
          items:
            type: string
          title: Reasons
          type: array
        station_id:
          minLength: 1
          title: Station Id
          type: string
      required:
      - station_id
      - eta
      - p_available
      - reasons
      - explanation_method
      - model_version
      - data_type
      title: PredictionResult
      type: object
    PressureResponse:
      additionalProperties: false
      properties:
        contract_version:
          default: 0.1.0
          title: Contract Version
          type: string
        scenario:
          $ref: '#/components/schemas/Scenario'
        stations:
          items:
            $ref: '#/components/schemas/PressureStation'
          title: Stations
          type: array
        time:
          format: date-time
          title: Time
          type: string
      required:
      - time
      - scenario
      - stations
      title: PressureResponse
      type: object
    PressureStation:
      additionalProperties: false
      properties:
        data_type:
          $ref: '#/components/schemas/DataType'
        p_available:
          maximum: 1.0
          minimum: 0.0
          title: P Available
          type: number
        pressure_score:
          maximum: 1.0
          minimum: 0.0
          title: Pressure Score
          type: number
        station_id:
          minLength: 1
          title: Station Id
          type: string
      required:
      - station_id
      - p_available
      - pressure_score
      - data_type
      title: PressureStation
      type: object
    QueueObservation:
      additionalProperties: false
      description: Queue seen by a station camera at ``observed_at``; mock until a
        real feed exists.
      properties:
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        data_type:
          $ref: '#/components/schemas/DataType'
        observed_at:
          format: date-time
          title: Observed At
          type: string
        source:
          minLength: 1
          title: Source
          type: string
        station_id:
          minLength: 1
          title: Station Id
          type: string
        vehicles_charging:
          minimum: 0.0
          title: Vehicles Charging
          type: integer
        vehicles_waiting:
          minimum: 0.0
          title: Vehicles Waiting
          type: integer
      required:
      - station_id
      - observed_at
      - vehicles_waiting
      - vehicles_charging
      - confidence
      - source
      - data_type
      title: QueueObservation
      type: object
    QueueSnapshotResponse:
      additionalProperties: false
      description: Camera views at one moment; stations without a camera are absent.
      properties:
        data_type:
          $ref: '#/components/schemas/DataType'
        observations:
          items:
            $ref: '#/components/schemas/QueueObservation'
          title: Observations
          type: array
        observed_at:
          format: date-time
          title: Observed At
          type: string
        scenario:
          $ref: '#/components/schemas/Scenario'
        source_notes:
          items:
            type: string
          title: Source Notes
          type: array
      required:
      - observed_at
      - scenario
      - observations
      - data_type
      - source_notes
      title: QueueSnapshotResponse
      type: object
    RecommendationRequest:
      additionalProperties: false
      properties:
        depart_time:
          format: date-time
          title: Depart Time
          type: string
        destination:
          $ref: '#/components/schemas/Coordinate'
        observed_at:
          format: date-time
          title: Observed At
          type: string
        origin:
          $ref: '#/components/schemas/Coordinate'
        request_id:
          minLength: 1
          title: Request Id
          type: string
        scenario:
          $ref: '#/components/schemas/Scenario'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
      required:
      - request_id
      - origin
      - destination
      - observed_at
      - depart_time
      - scenario
      - vehicle
      title: RecommendationRequest
      type: object
    RecommendationResult:
      additionalProperties: false
      properties:
        allocation_method:
          minLength: 1
          title: Allocation Method
          type: string
        backup:
          anyOf:
          - $ref: '#/components/schemas/Plan'
          - type: 'null'
        contract_version:
          default: 0.1.0
          title: Contract Version
          type: string
        data_type:
          $ref: '#/components/schemas/DataType'
        model_version:
          minLength: 1
          title: Model Version
          type: string
        plan_p:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Plan P
        plan_p_assumption:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan P Assumption
        primary:
          anyOf:
          - $ref: '#/components/schemas/Plan'
          - type: 'null'
        reasons:
          items:
            type: string
          title: Reasons
          type: array
        request_id:
          minLength: 1
          title: Request Id
          type: string
        time_shift:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 60.0
            multipleOf: 5.0
            type: integer
          - type: 'null'
          title: Time Shift
        time_shift_estimate:
          anyOf:
          - $ref: '#/components/schemas/TimeShiftEstimate'
          - type: 'null'
        time_shift_evaluated:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Time Shift Evaluated
      required:
      - request_id
      - primary
      - backup
      - reasons
      - model_version
      - allocation_method
      - data_type
      title: RecommendationResult
      type: object
    ResetRequest:
      additionalProperties: false
      properties:
        contract_version:
          default: 0.1.0
          title: Contract Version
          type: string
      title: ResetRequest
      type: object
    ResetResponse:
      additionalProperties: false
      properties:
        contract_version:
          default: 0.1.0
          title: Contract Version
          type: string
        reset:
          title: Reset
          type: boolean
      required:
      - reset
      title: ResetResponse
      type: object
    RouteRequest:
      additionalProperties: false
      properties:
        depart_time:
          format: date-time
          title: Depart Time
          type: string
        destination:
          $ref: '#/components/schemas/Coordinate'
        origin:
          $ref: '#/components/schemas/Coordinate'
        vehicle:
          anyOf:
          - $ref: '#/components/schemas/Vehicle'
          - type: 'null'
      required:
      - origin
      - destination
      - depart_time
      title: RouteRequest
      type: object
    RouteResult:
      additionalProperties: false
      properties:
        distance_km:
          minimum: 0.0
          title: Distance Km
          type: number
        duration_minutes:
          minimum: 0.0
          title: Duration Minutes
          type: number
        geometry:
          anyOf:
          - items:
              $ref: '#/components/schemas/Coordinate'
            type: array
          - type: 'null'
          title: Geometry
        source:
          minLength: 1
          title: Source
          type: string
      required:
      - distance_km
      - duration_minutes
      - source
      title: RouteResult
      type: object
    RuntimeContext:
      additionalProperties: false
      properties:
        allocation_backend:
          enum:
          - memory
          - sqlite
          title: Allocation Backend
          type: string
        available:
          title: Available
          type: boolean
        clock_mode:
          enum:
          - mock
          - replay
          - live
          title: Clock Mode
          type: string
        data_type:
          $ref: '#/components/schemas/DataType'
        history_end:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: History End
        history_start:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: History Start
        max_horizon_minutes:
          title: Max Horizon Minutes
          type: integer
        message:
          title: Message
          type: string
        observed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Observed At
        places_available:
          title: Places Available
          type: boolean
        scenario:
          $ref: '#/components/schemas/Scenario'
      required:
      - clock_mode
      - scenario
      - data_type
      - observed_at
      - history_start
      - history_end
      - max_horizon_minutes
      - places_available
      - available
      - message
      - allocation_backend
      title: RuntimeContext
      type: object
    Scenario:
      enum:
      - normal
      - holiday_30_4
      - tet
      title: Scenario
      type: string
    ShiftDeparturesChange:
      additionalProperties: false
      properties:
        fraction:
          default: 0.2
          exclusiveMinimum: 0.0
          maximum: 1.0
          title: Fraction
          type: number
        kind:
          const: shift_departures
          title: Kind
          type: string
        target_hour:
          default: 21
          maximum: 21.0
          minimum: 20.0
          title: Target Hour
          type: integer
      required:
      - kind
      title: ShiftDeparturesChange
      type: object
    SimulationMetrics:
      additionalProperties: false
      properties:
        failed_count:
          minimum: 0.0
          title: Failed Count
          type: integer
        mean_detour_km:
          minimum: 0.0
          title: Mean Detour Km
          type: number
        mean_wait_minutes:
          minimum: 0.0
          title: Mean Wait Minutes
          type: number
        success_rate:
          maximum: 1.0
          minimum: 0.0
          title: Success Rate
          type: number
        vehicle_count:
          minimum: 0.0
          title: Vehicle Count
          type: integer
      required:
      - success_rate
      - mean_detour_km
      - mean_wait_minutes
      - failed_count
      - vehicle_count
      title: SimulationMetrics
      type: object
    SimulationRequest:
      additionalProperties: false
      properties:
        contract_version:
          default: 0.1.0
          title: Contract Version
          type: string
        scenario:
          $ref: '#/components/schemas/Scenario'
        seed:
          title: Seed
          type: integer
        strategy:
          $ref: '#/components/schemas/Strategy'
        vehicle_count:
          exclusiveMinimum: 0.0
          title: Vehicle Count
          type: integer
      required:
      - scenario
      - seed
      - vehicle_count
      - strategy
      title: SimulationRequest
      type: object
    SimulationResult:
      additionalProperties: false
      properties:
        contract_version:
          default: 0.1.0
          title: Contract Version
          type: string
        fixture_hash:
          pattern: ^[0-9a-f]{64}$
          title: Fixture Hash
          type: string
        metrics:
          $ref: '#/components/schemas/SimulationMetrics'
        model_version:
          minLength: 1
          title: Model Version
          type: string
        scenario:
          $ref: '#/components/schemas/Scenario'
        seed:
          title: Seed
          type: integer
        strategy:
          $ref: '#/components/schemas/Strategy'
      required:
      - scenario
      - seed
      - strategy
      - model_version
      - metrics
      - fixture_hash
      title: SimulationResult
      type: object
    SnapshotBatch:
      additionalProperties: false
      properties:
        snapshots:
          items:
            $ref: '#/components/schemas/PartnerSnapshot'
          maxItems: 1000
          minItems: 1
          title: Snapshots
          type: array
      required:
      - snapshots
      title: SnapshotBatch
      type: object
    Station:
      additionalProperties: false
      properties:
        assumptions:
          items:
            type: string
          title: Assumptions
          type: array
        connector_types:
          items:
            type: string
          minItems: 1
          title: Connector Types
          type: array
        lat:
          maximum: 90.0
          minimum: -90.0
          title: Lat
          type: number
        lng:
          maximum: 180.0
          minimum: -180.0
          title: Lng
          type: number
        n_ports:
          minimum: 1.0
          title: N Ports
          type: integer
        name:
          minLength: 1
          title: Name
          type: string
        network:
          minLength: 1
          title: Network
          type: string
        power_kw:
          exclusiveMinimum: 0.0
          title: Power Kw
          type: number
        source:
          minLength: 1
          title: Source
          type: string
        station_id:
          minLength: 1
          title: Station Id
          type: string
        station_type:
          minLength: 1
          title: Station Type
          type: string
      required:
      - station_id
      - name
      - lat
      - lng
      - n_ports
      - power_kw
      - connector_types
      - network
      - station_type
      - source
      - assumptions
      title: Station
      type: object
    StationListResponse:
      additionalProperties: false
      properties:
        data_type:
          $ref: '#/components/schemas/DataType'
        source_notes:
          items:
            type: string
          title: Source Notes
          type: array
        stations:
          items:
            $ref: '#/components/schemas/Station'
          title: Stations
          type: array
      required:
      - stations
      - data_type
      - source_notes
      title: StationListResponse
      type: object
    Strategy:
      enum:
      - nearest
      - currently_available
      - ai_allocation
      title: Strategy
      type: string
    TimeShiftEstimate:
      additionalProperties: false
      properties:
        assumptions:
          items:
            type: string
          minItems: 1
          title: Assumptions
          type: array
        depart_time:
          format: date-time
          title: Depart Time
          type: string
        eta:
          format: date-time
          title: Eta
          type: string
        improvement:
          exclusiveMinimum: 0.0
          maximum: 1.0
          title: Improvement
          type: number
        minutes:
          exclusiveMinimum: 0.0
          maximum: 60.0
          multipleOf: 5.0
          title: Minutes
          type: integer
        p_available:
          maximum: 1.0
          minimum: 0.0
          title: P Available
          type: number
        station_id:
          minLength: 1
          title: Station Id
          type: string
      required:
      - minutes
      - station_id
      - depart_time
      - eta
      - p_available
      - improvement
      - assumptions
      title: TimeShiftEstimate
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    Vehicle:
      additionalProperties: false
      properties:
        battery_kwh:
          exclusiveMinimum: 0.0
          title: Battery Kwh
          type: number
        connector_type:
          minLength: 1
          title: Connector Type
          type: string
        consumption_kwh_per_km:
          exclusiveMinimum: 0.0
          title: Consumption Kwh Per Km
          type: number
        soc_pct:
          maximum: 100.0
          minimum: 0.0
          title: Soc Pct
          type: number
      required:
      - soc_pct
      - battery_kwh
      - consumption_kwh_per_km
      - connector_type
      title: Vehicle
      type: object
    WhatIfRequest:
      additionalProperties: false
      properties:
        change:
          discriminator:
            mapping:
              add_ports: '#/components/schemas/AddPortsChange'
              shift_departures: '#/components/schemas/ShiftDeparturesChange'
            propertyName: kind
          oneOf:
          - $ref: '#/components/schemas/AddPortsChange'
          - $ref: '#/components/schemas/ShiftDeparturesChange'
          title: Change
        contract_version:
          default: 0.1.0
          title: Contract Version
          type: string
        scenario:
          $ref: '#/components/schemas/Scenario'
        seed:
          minimum: 0.0
          title: Seed
          type: integer
        strategy:
          $ref: '#/components/schemas/Strategy'
        vehicle_count:
          exclusiveMinimum: 0.0
          title: Vehicle Count
          type: integer
      required:
      - scenario
      - seed
      - vehicle_count
      - strategy
      - change
      title: WhatIfRequest
      type: object
    WhatIfResult:
      additionalProperties: false
      properties:
        after:
          $ref: '#/components/schemas/SimulationResult'
        after_config_hash:
          pattern: ^[0-9a-f]{64}$
          title: After Config Hash
          type: string
        assumptions:
          items:
            type: string
          minItems: 1
          title: Assumptions
          type: array
        before:
          $ref: '#/components/schemas/SimulationResult'
        before_config_hash:
          pattern: ^[0-9a-f]{64}$
          title: Before Config Hash
          type: string
        capacity_history_hash:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Capacity History Hash
        capacity_model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Capacity Model Version
        change:
          discriminator:
            mapping:
              add_ports: '#/components/schemas/AddPortsChange'
              shift_departures: '#/components/schemas/ShiftDeparturesChange'
            propertyName: kind
          oneOf:
          - $ref: '#/components/schemas/AddPortsChange'
          - $ref: '#/components/schemas/ShiftDeparturesChange'
          title: Change
        contract_version:
          const: 0.1.0
          default: 0.1.0
          title: Contract Version
          type: string
        data_type:
          const: simulated
          default: simulated
          title: Data Type
          type: string
        prediction_mode:
          anyOf:
          - const: capacity_retrained
            type: string
          - type: 'null'
          title: Prediction Mode
        shifted_vehicle_count:
          minimum: 0.0
          title: Shifted Vehicle Count
          type: integer
      required:
      - before
      - after
      - change
      - before_config_hash
      - after_config_hash
      - shifted_vehicle_count
      - assumptions
      title: WhatIfResult
      type: object
info:
  title: V-EV Flow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/health:
    get:
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health
                type: object
          description: Successful Response
      summary: Health
  /api/partner/snapshots:
    post:
      operationId: ingestSnapshots
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotBatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ingest Snapshots
  /api/places/detail:
    get:
      operationId: resolvePlace
      parameters:
      - in: query
        name: place_id
        required: true
        schema:
          maxLength: 1024
          minLength: 1
          title: Place Id
          type: string
      - in: query
        name: session
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceLocation'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Resolve Place
  /api/places/search:
    get:
      operationId: searchPlaces
      parameters:
      - in: query
        name: q
        required: true
        schema:
          maxLength: 200
          minLength: 2
          pattern: .*\S.*
          title: Q
          type: string
      - in: query
        name: session
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSuggestions'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Search Places
  /api/predict:
    post:
      operationId: predictAvailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResult'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Predict
  /api/pressure:
    get:
      operationId: getPressure
      parameters:
      - in: query
        name: scenario
        required: true
        schema:
          $ref: '#/components/schemas/Scenario'
      - in: query
        name: time
        required: true
        schema:
          format: date-time
          title: Time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PressureResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Pressure
  /api/ready:
    get:
      operationId: ready
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Ready
                type: object
          description: Successful Response
      summary: Ready
  /api/recommend:
    post:
      operationId: recommendStation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResult'
          description: Successful Response
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Recommend
  /api/reset:
    post:
      operationId: resetDemo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Reset
  /api/routes:
    post:
      description: Read-only road geometry; never records recommendations or allocations.
      operationId: mapRoutes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RouteResult'
                title: Response Maproutes
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Map Routes
  /api/runtime:
    get:
      operationId: runtimeContext
      parameters:
      - in: query
        name: scenario
        required: false
        schema:
          $ref: '#/components/schemas/Scenario'
          default: normal
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeContext'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Runtime Context
  /api/simulate:
    post:
      operationId: simulate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Simulate
  /api/stations:
    get:
      operationId: listStations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationListResponse'
          description: Successful Response
      summary: List Stations
  /api/stations/queue:
    get:
      description: Camera queue views; stations without a camera are left out.
      operationId: getStationQueues
      parameters:
      - in: query
        name: observed_at
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Observed At
      - in: query
        name: scenario
        required: false
        schema:
          $ref: '#/components/schemas/Scenario'
          default: normal
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSnapshotResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Station Queues
  /api/whatif:
    post:
      operationId: whatIf
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/WhatIfRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatIfResult'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Whatif
